# Render Blueprint — деплой бота одной кнопкой:
#   Render → New + → Blueprint → выберите репозиторий с этими файлами.
# При создании заполните переменные (все, кроме BOT_TOKEN, можно оставить пустыми).
#
# Вся конфигурация живёт в env — config.json на Render не нужен.
services:
  - type: web
    name: tg-ai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false          # токен от @BotFather (обязательно)
      - key: ADMIN_IDS
        sync: false          # ваш Telegram ID (узнать: @userinfobot)
      # Провайдеры из env, примеры:
      #   PROVIDER_1=openrouter:sk-or-v1-...
      #   PROVIDER_2=deepseek:sk-...
      #   PROVIDER_3=Мой прокси|auto|https://api.example.com/v1|key123  (протокол определится по URL)
      #   PROVIDER_4=Ollama|openai|http://мой-хост:11434|               (без ключа)
      - key: PROVIDER_1
        sync: false
      - key: PROVIDER_2
        sync: false
      # Свой провайдер с произвольным URL (без пресетов, ни от кого не зависит):
      #   CUSTOM_URL=https://api.мой-сервер.com/v1
      #   CUSTOM_KEY=sk-...        (пустой = сервер без ключа, напр. Ollama/LM Studio)
      #   CUSTOM_PROTOCOL=openai|anthropic|gemini|auto (auto — определить по URL)
      #   CUSTOM_NAME / CUSTOM_MODEL — имя в меню и модель по умолчанию
      - key: CUSTOM_URL
        sync: false
      - key: CUSTOM_KEY
        sync: false
      - key: DEFAULT_MODEL   # модель по умолчанию, напр. deepseek-chat, openai/gpt-4o-mini
        sync: false
      - key: SYSTEM_PROMPT
        sync: false
      - key: MAX_HISTORY
        value: "24"
